<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SensorGrid Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { padding: 24px; background: #0f172a; color: #f8fafc; }
    h1 { margin-bottom: 20px; font-size: 1.6rem; color: #38bdf8; }
    .container { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    
    /* Form Styling */
    .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; }
    input, select { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #fff; }
    button { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:hover { background: #0369a1; }
    .error-msg { color: #f87171; font-size: 0.75rem; margin-top: 4px; display: none; }

    /* Dashboard Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; align-content: start; }
    .sensor-card { background: #1e293b; border-left: 4px solid #38bdf8; padding: 16px; border-radius: 6px; border-top: 1px solid #334155; border-right: 1px solid #334155; border-bottom: 1px solid #334155; }
    .sensor-card h3 { font-size: 1.1rem; color: #fff; margin-bottom: 6px; }
    .sensor-card p { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
    .sensor-card .badge { display: inline-block; padding: 2px 8px; font-size: 0.75rem; border-radius: 4px; background: #334155; color: #38bdf8; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>SensorGrid Live Dashboard</h1>
  <div class="container">
    <div class="card">
      <h2>Add New Sensor</h2>
      <form id="sensorForm">
        <div class="form-group">
          <label for="sensorId">Sensor ID</label>
          <input type="text" id="sensorId" placeholder="e.g., SENS-001" />
          <div class="error-msg" id="idErr">Sensor ID cannot be empty.</div>
        </div>
        <div class="form-group">
          <label for="sensorType">Sensor Type</label>
          <select id="sensorType">
            <option value="">Select Type</option>
            <option value="Ultrasonic Water Level">Ultrasonic Water Level</option>
            <option value="Temperature & Humidity">Temperature & Humidity</option>
            <option value="Pressure">Pressure</option>
          </select>
          <div class="error-msg" id="typeErr">Please select a sensor type.</div>
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" placeholder="e.g., Tank A - Level 2" />
          <div class="error-msg" id="locErr">Location cannot be empty.</div>
        </div>
        <div class="form-group">
          <label for="threshold">Threshold Limit</label>
          <input type="number" id="threshold" placeholder="e.g., 80" />
          <div class="error-msg" id="threshErr">Enter a valid positive threshold.</div>
        </div>
        <button type="submit">Add Sensor</button>
      </form>
    </div>

    <div class="grid" id="sensorContainer">
      <!-- Dynamic sensor cards will appear here -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
